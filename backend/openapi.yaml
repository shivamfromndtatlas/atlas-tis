          type: string
          maxLength: 32
        ip:
          type: string
          nullable: true
        request_id:
          type: string
          maxLength: 64
        action:
          type: string
          maxLength: 64
        object_type:
          type: string
          maxLength: 64
        object_id:
          type: string
          maxLength: 64
        object_repr:
          type: string
          maxLength: 255
        changes: {}
        source:
          type: string
          maxLength: 32
