openapi: 3.0.3
info:
  title: NDT Atlas Talent Intelligence System API
  version: 0.1.0
paths:
  /api/v1/agencies/:
    get:
      operationId: agencies_list
      parameters:
      - in: query
        name: agency_type
        schema:
          type: string
          enum:
          - campus
          - individual
          - portal
          - referral
          - search
          - staffing
        description: |-
          * `search` - Specialist search agency
          * `staffing` - Staffing & sourcing agency
          * `portal` - Job portal
          * `referral` - Referral network
          * `campus` - Campus / institute
          * `individual` - Individual consultant
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - inactive
          - paused
        description: |-
          * `active` - Active
          * `paused` - Paused
          * `inactive` - Inactive
      tags:
      - agencies
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgencyList'
          description: ''
    post:
      operationId: agencies_create
      tags:
      - agencies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgencyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgencyRequest'
        required: true
      security:
      - cookieJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
  /api/v1/agencies/{id}/:
    get:
      operationId: agencies_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agencies
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
    put:
      operationId: agencies_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agencies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgencyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgencyRequest'
        required: true
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
    patch:
      operationId: agencies_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agencies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAgencyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAgencyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAgencyRequest'
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
    delete:
      operationId: agencies_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agencies
      security:
      - cookieJWT: []
      responses:
        '204':
          description: No response body
  /api/v1/audit/:
    get:
      operationId: audit_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: string
          format: date-time
      - in: query
        name: until
        schema:
          type: string
          format: date-time
      tags:
      - audit
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit/{id}/:
