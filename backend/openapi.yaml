components:
  schemas:
    Agency:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 24
        agency_type:
          $ref: '#/components/schemas/AgencyTypeEnum'
        status:
          $ref: '#/components/schemas/AgencyStatusEnum'
        contact_name:
          type: string
          maxLength: 160
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        contact_phone:
          type: string
          maxLength: 32
        commercial_terms:
          type: string
        sla_notes:
          type: string
        account_lead:
          type: string
          format: uuid
          nullable: true
        account_lead_name:
          type: string
          readOnly: true
        consultant_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_lead_name
      - consultant_count
      - created_at
      - id
      - name
      - updated_at
    AgencyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: string
          maxLength: 24
        agency_type:
          $ref: '#/components/schemas/AgencyTypeEnum'
        status:
          $ref: '#/components/schemas/AgencyStatusEnum'
        contact_name:
          type: string
          maxLength: 160
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        contact_phone:
          type: string
          maxLength: 32
        commercial_terms:
          type: string
        sla_notes:
          type: string
        account_lead:
          type: string
          format: uuid
          nullable: true
      required:
      - name
    AgencyStatusEnum:
      enum:
      - active
      - paused
      - inactive
      type: string
      description: |-
        * `active` - Active
        * `paused` - Paused
        * `inactive` - Inactive
    AgencyTypeEnum:
      enum:
      - search
      - staffing
      - portal
      - referral
      - campus
      - individual
      type: string
      description: |-
        * `search` - Specialist search agency
        * `staffing` - Staffing & sourcing agency
        * `portal` - Job portal
        * `referral` - Referral network
        * `campus` - Campus / institute
        * `individual` - Individual consultant
