# Local development stack. Usage (from repo root):
#   docker compose -f infra/docker-compose.yml up --build
# Frontend: http://localhost:5173  API: http://localhost:8000/api/v1/docs/  Mail: http://localhost:8025
name: atlas-tis

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tis
      MYSQL_USER: tis
      MYSQL_PASSWORD: tis
      MYSQL_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  backend:
    build: { context: ../backend, dockerfile: ../infra/docker/backend.Dockerfile }
    env_file: [../backend/.env.example]
    environment:
      DATABASE_URL: mysql://tis:tis@mysql:3306/tis
      REDIS_URL: redis://redis:6379/0
      EMAIL_URL: smtp://mailpit:1025
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CELERY_TASK_ALWAYS_EAGER: "false"
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]
    volumes: [../backend:/app, media:/app/media]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ../backend, dockerfile: ../infra/docker/backend.Dockerfile }
    env_file: [../backend/.env.example]
    environment:
      DATABASE_URL: mysql://tis:tis@mysql:3306/tis
      REDIS_URL: redis://redis:6379/0
      EMAIL_URL: smtp://mailpit:1025
    command: celery -A config worker -l info
    volumes: [../backend:/app, media:/app/media]
    depends_on: [backend]

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://backend:8000
    ports: ["5173:5173"]
    volumes: [../frontend:/app, frontend-node-modules:/app/node_modules]
    depends_on: [backend]

volumes:
  mysql-data:
  media:
  frontend-node-modules:
